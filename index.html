<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YOW Flight Deals</title>
<meta name="description" content="Hand-picked cheap flights out of Ottawa (YOW).">
<script nowprocket data-noptimize="1" data-cfasync="false" data-wpfc-render="false" seraph-accel-crit="1" data-no-defer="1" data-cmp-ab="2">(function(){var script=document.createElement("script");script.async=1;script.setAttribute("data-cmp-ab","2");script.src='https://emrldtp.com/NTg3ODg2.js?t=587886';document.head.appendChild(script);})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="topbar"><div class="wrap">
  <a class="brand" href="./">YOW <span>Flight Deals</span></a>
</div></div>

<div class="wrap">
  <header class="hero">
    <div class="eyebrow">Ottawa · YOW</div>
    <h1>Hand-picked flight deals from Ottawa</h1>
    <p class="sub">Cheap flights out of YOW, found and checked by a real person. Book quickly, because good fares don't last.</p>
  </header>

  <div class="filters" id="filters"></div>
  <main class="grid" id="grid"><div class="empty">Loading deals...</div></main>
</div>

<footer><div class="wrap">
  Prices were correct when posted and can change at any time. Always check the final price before you book.
</div></footer>

<script src="site.js"></script>
<script>
let posts = [];
let region = "all";

function card(p) {
  const r = regionOf(p.region);
  const expired = isExpired(p);
  const pct = savingsPct(p);
  const img = p.image
    ? `<div class="img" style="background-image:url('${esc(safeUrl(p.image).replace(/'/g, "%27"))}')"></div>`
    : `<div class="img"><div class="ph">${r.icon}</div></div>`;
  return `<a class="post-card ${expired ? "is-expired" : ""}" href="post.html?id=${encodeURIComponent(p.id)}">
    ${img}
    <div class="body">
      <div class="meta"><span>${r.icon} ${esc(r.name)}</span><span>${fmtDate(p.published_at, { month: "short", day: "numeric" })}</span></div>
      <h2>${esc(p.title)}</h2>
      <div class="meta">${p.travel_dates ? `<span>${esc(p.travel_dates)}</span>` : ""}${p.airline ? `<span>${esc(p.airline)}</span>` : ""}</div>
      <div class="price-row">
        <span class="price">${fmtMoney(p.price, p.currency)}</span>
        ${p.usual_price ? `<span class="was">${fmtMoney(p.usual_price, p.currency)}</span>` : ""}
        ${expired ? `<span class="badge expired">Expired</span>` : pct >= 5 ? `<span class="badge">${pct}% off</span>` : ""}
      </div>
    </div>
  </a>`;
}

function render() {
  const list = posts
    .filter((p) => region === "all" || p.region === region)
    // Live deals first, expired ones after, newest first within each.
    .sort((a, b) => isExpired(a) - isExpired(b));
  document.getElementById("grid").innerHTML = list.length
    ? list.map(card).join("")
    : `<div class="empty">No deals here yet. Check back soon!</div>`;
}

function setupFilters() {
  const used = new Set(posts.map((p) => p.region));
  const chips = [{ id: "all", name: "All deals", icon: "" }, ...REGIONS.filter((r) => used.has(r.id))];
  const el = document.getElementById("filters");
  el.innerHTML = chips.map((c) =>
    `<button class="chip" data-r="${c.id}" aria-pressed="${c.id === region}">${c.icon} ${esc(c.name)}</button>`).join("");
  el.onclick = (e) => {
    const b = e.target.closest("[data-r]"); if (!b) return;
    region = b.dataset.r;
    el.querySelectorAll(".chip").forEach((c) => c.setAttribute("aria-pressed", c.dataset.r === region));
    render();
  };
}

loadPosts()
  .then((p) => { posts = p.filter((x) => !x.draft); setupFilters(); render(); })
  .catch(() => { document.getElementById("grid").innerHTML = `<div class="empty">Couldn't load deals right now.</div>`; });
</script>
</body>
</html>
